{% extends 'base.html' %}

{% block content %}
<section class="auth-section">
  <div class="container auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">Welcome back</span>
      <h2>School portal login</h2>
      <form method="post" action="/login">
        <label>
          Email
          <input type="email" name="email" placeholder="name@school.com" required />
        </label>
        <label>
          Password
          <input type="password" name="password" placeholder="Enter password" required />
        </label>
        <button type="submit" class="btn btn-primary full">Login</button>
      </form>
      <div class="demo-box">
        <p>Demo accounts:</p>
        <ul>
          <li>Admin: admin@school.com / admin123</li>
          <li>Teacher: teacher@school.com / teacher123</li>
          <li>Student: student@school.com / student123</li>
          <li>Parent: parent@school.com / parent123</li>
        </ul>
      </div>
    </div>
  </div>
</section>
{% endblock %}
