services:
  - type: web
    name: school-lms-platform
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /healthz
    disk:
      name: school-lms-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: school-lms-db
          property: connectionString
      - key: SCHOOL_MEDIA_ROOT
        value: /var/data/media
      - key: HOST
        value: 0.0.0.0

databases:
  - name: school-lms-db
    plan: basic-256mb
    databaseName: school_lms
    user: school_lms_user